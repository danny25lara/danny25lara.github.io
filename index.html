<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Matriz Inversa</title>
</head>
<body>
    <div class="container">
        <h1>Calculadora de Inversa (3x3)</h1>
        <p>Introduce los valores de la matriz A:</p>
        <div id="matrix-input" class="matrix">
            <input type="number" class="cell" data-row="0" data-col="0">
            <input type="number" class="cell" data-row="0" data-col="1">
            <input type="number" class="cell" data-row="0" data-col="2"><br>

            <input type="number" class="cell" data-row="1" data-col="0">
            <input type="number" class="cell" data-row="1" data-col="1">
            <input type="number" class="cell" data-row="1" data-col="2"><br>

            <input type="number" class="cell" data-row="2" data-col="0">
            <input type="number" class="cell" data-row="2" data-col="1">
            <input type="number" class="cell" data-row="2" data-col="2">
        </div>

        <button onclick="calculateInverse()">Calcular Inversa</button>
        <button onclick="limpiar()">Limpiar</button>

        <div id="result-area">
            <h2>Resultado (A⁻¹):</h2>
            <div id="determinant-output"></div>
            <div id="inverse-matrix" class="matrix result-matrix">
                </div>
            <p id="error-message" class="error"></p>
        </div>
    </div>

    <script>
        // --- Funciones Matemáticas ---
/**
 * Calcula el determinante de una matriz 3x3.
 * @param {Array<Array<number>>} A La matriz 3x3.
 * @returns {number} El determinante.
 */
function determinant3x3(A) {
    // Implementación usando la Regla de Sarrus o Expansión por Cofactores
    return A[0][0] * (A[1][1] * A[2][2] - A[1][2] * A[2][1]) -
           A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0]) +
           A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]);
}
/**
 * Calcula el subdeterminante (menor) de la matriz al eliminar la fila i y la columna j.
 * (Solo se usa para la matriz de cofactores de 3x3)
 * @param {Array<Array<number>>} A La matriz 3x3.
 * @param {number} i Fila a eliminar (0, 1, 2).
 * @param {number} j Columna a eliminar (0, 1, 2).
 * @returns {number} El subdeterminante 2x2.
 */
function subDeterminant2x2(A, i, j) {
    const minor = [];
    for (let row = 0; row < 3; row++) {
        if (row !== i) {
            const newRow = [];
            for (let col = 0; col < 3; col++) {
                if (col !== j) {
                    newRow.push(A[row][col]);
                }
            }
            minor.push(newRow);
        }
    }
    // Determinate 2x2: ad - bc
    return minor[0][0] * minor[1][1] - minor[0][1] * minor[1][0];
}
/**
 * Transpone la matriz de cofactores para obtener la adjunta.
 * @param {Array<Array<number>>} C La matriz de cofactores.
 * @returns {Array<Array<number>>} La matriz adjunta (traspuesta de C).
 */
function transpose(C) {
    // Para una 3x3
    return [
        [C[0][0], C[1][0], C[2][0]],
        [C[0][1], C[1][1], C[2][1]],
        [C[0][2], C[1][2], C[2][2]]
    ];
}
// --- Lógica Principal del Cálculo y UI ---
function calculateInverse() {
    const cells = document.querySelectorAll('.cell');
    const N = 3;
    const A = [];
    let k = 0;
    
    // 1. Leer la matriz del HTML y **Validar Entradas**
    for (let i = 0; i < N; i++) {
        A[i] = [];
        for (let j = 0; j < N; j++) {
            const value = parseFloat(cells[k++].value);
            
            // **Validación de Entradas:** Asegura que todos los campos sean números válidos.
            if (isNaN(value)) {
                displayError("Error: Todos los campos deben ser llenados con números válidos (enteros o flotantes).");
                return;
            }
            A[i][j] = value;
        }
    }
    document.getElementById('error-message').textContent = ''; // Limpiar errores
    // 2. Calcular el determinante
    const det = determinant3x3(A);
    // Usamos toFixed(4) solo para mostrar el valor, no para el cálculo
    document.getElementById('determinant-output').textContent = `Determinante: ${det.toFixed(4)}`;
    // **Manejo de Matrices Singulares:** Verifica si el determinante es cero
    if (Math.abs(det) < 1e-9) { 
        displayError("Advertencia: La matriz es singular. Su determinante es cero, por lo tanto, la matriz inversa no existe.");
        displayResult(null, N); // Limpiar resultado
        return;
    }
    // 3. Calcular la Matriz de Cofactores (C)
    const C = [];
    for (let i = 0; i < N; i++) {
        C[i] = [];
        for (let j = 0; j < N; j++) {
            const minor = subDeterminant2x2(A, i, j);
            // El cofactor es el menor con el signo correcto (-1)^(i+j)
            C[i][j] = Math.pow(-1, i + j) * minor;
        }
    }
    // 4. Calcular la Matriz Adjunta (Adj(A) = C^T)
    const AdjA = transpose(C);
    // 5. Calcular la Inversa (A⁻¹ = (1/det) * Adj(A))
    const inverse = [];
    const invDet = 1 / det;
    for (let i = 0; i < N; i++) {
        inverse[i] = [];
        for (let j = 0; j < N; j++) {
            // Multiplicamos cada elemento de la adjunta por 1/det
            inverse[i][j] = AdjA[i][j] * invDet;
        }
    }
    // 6. Mostrar el resultado
    displayResult(inverse, N);
}
/**
 * Muestra la matriz inversa en el HTML.
 * @param {Array<Array<number>> | null} inverse La matriz inversa o null si hubo error.
 * @param {number} N Dimensión de la matriz.
 */
function displayResult(inverse, N) {
    const resultDiv = document.getElementById('inverse-matrix');
    resultDiv.innerHTML = ''; // Limpiar contenido previo
    if (!inverse) return;
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            const cell = document.createElement('input');
            cell.classList.add('cell');
            cell.readOnly = true;
            // Muestra el resultado con 4 decimales
            cell.value = inverse[i][j].toFixed(4); 
            resultDiv.appendChild(cell);
        }
        resultDiv.appendChild(document.createElement('br'));
    }
}
function limpiar() {
    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell => cell.value = '');
    document.getElementById('determinant-output').textContent = '';
    document.getElementById('inverse-matrix').innerHTML = '';
    document.getElementById('error-message').textContent = '';
}
function displayError(message) {
    // Proporciona una **retroalimentación clara e inmediata**
    document.getElementById('error-message').textContent = message;
    document.getElementById('determinant-output').textContent = '';
    document.getElementById('inverse-matrix').innerHTML = ''; // Limpiar matriz
}
    </script>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.container {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    max-width: 500px;
    width: 100%;
}

h1 {
    color: #007bff;
    text-align: center;
}

.matrix {
    display: inline-block;
    padding: 10px;
    border: 2px solid #007bff;
    border-radius: 5px;
    line-height: 0; /* Para controlar el espacio de los <br> */
    margin-bottom: 20px;
}

.cell {
    width: 50px;
    height: 30px;
    margin: 5px;
    text-align: center;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 3px;
    box-sizing: border-box;
}

.result-matrix .cell {
    width: 80px; /* Más ancho para mostrar decimales */
    background-color: #e9ecef;
    border: 1px solid #adb5bd;
    font-weight: bold;
}

button {
    background-color: #28a745;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    display: block;
    width: 100%;
    margin-bottom: 20px;
}

button:hover {
    background-color: #218838;
}

.error {
    color: red;
    font-weight: bold;
    text-align: center;
}

#determinant-output {
    font-weight: bold;
    margin-bottom: 10px;
}
    </style>
</body>
</html>
